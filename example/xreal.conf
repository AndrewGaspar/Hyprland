## HypXRland profile for the XREAL Air 2 Ultra as a 3DoF OpenXR display (WP-XR1).
##
## Source this from your classic hyprland.conf (alongside, or instead of, example/openxr.conf):
##   source = ~/.config/hypr/xreal.conf
##
## This tunes HypXRland for a 3DoF, orientation-only, controller-less, hands-less birdbath HMD: a
## curved arc of world-fixed panels you look around by turning your head, driven by keyboard + gaze +
## voice (the device exposes an HMD only — no controllers, no hand tracking). See docs/openxr/07-xreal.md
## for the full rig (udev, build, the flat<->XR toggle) and docs/openxr/research/XREAL-3DOF.md for why.
##
## The flat<->XR toggle (scripts/xreal-mode.sh) sets openxr:runtime_json and enables the session at
## runtime; you do NOT hard-code the runtime path here. Bind the toggle to a key at the bottom.


openxr {
    enabled = true

    # Keep re-probing so the session comes up automatically once the xreal monado runtime starts.
    reprobe = true

    # 3DoF has no positional tracking, so the arc is re-seated to your head pose (yaw-dominant, since
    # there is no translation to zero) the first time you don the glasses in a session. Re-don (or the
    # toggle's disable+enable) recenters the whole arc in front of you.
    recenter_on_plug = true

    # GPU: leave UNSET on this rig. The glasses' DisplayPort output hangs off the SAME GPU HypXRland
    # renders the desktop with (on the AMD box, DP-5 is on the 890M iGPU / renderD129, which is also the
    # primary; on a single-GPU laptop like Lunar Lake there is only one GPU). The wrong-GPU guard in
    # start() verifies this at session start and refuses safely if it is ever wrong. Only set openxr:gpu
    # if your glasses' DP connector is driven by a DIFFERENT GPU than Hyprland's primary.
    # gpu = /dev/dri/renderD129

    # Additive/see-through: birdbath optics are optical see-through. If you want the panels to composite
    # over the real world rather than a black void, try additive (falls back to opaque with a warning if
    # the runtime doesn't advertise it). Opaque (default) is the safe start.
    # blend_mode = additive

    # No controllers and no hands on this device — the driver exposes an HMD only. Turn off the ray
    # pointer and gate hands OFF so nothing waits on input devices that will never appear. Keyboard +
    # gaze + voice (hypxrvoice) are THE interaction model here.
    pointer    = false
    hand_input = off

    # No user-presence / don-doff signal exists for these glasses (the driver does not surface the wear
    # sensor), so the session reads as always-present. Don't tie the monitors to a presence gate that
    # can never fire — keep them plugged for the whole session. UNPLUG is what removes the display: pull
    # the USB cable and DP-5 + the HID device vanish, monado loses the HMD, and the session-loss path
    # unplugs the XR monitors (docs/openxr/07-xreal.md §doff). 'session' keeps them up while a session
    # exists, which for this always-on runtime means "while xreal-mode xr is active".
    monitors_follow_session = session

    # A comfortable default size/distance for the seated arc.
    default_size     = 1.1
    default_distance = 1.4
}


#####################################################
### 3DoF curved arc — three world-fixed panels    ###
#####################################################

## anchor:local panels arranged on a ~1.4 m cylinder at seated eye height, spread ~±35° (inside the
## 46°/eye FOV so the panel you face fills the lens). They are WORLD-FIXED: you look around the arc by
## turning your head. pos: is meters (OpenXR: +X right, +Y up, -Z forward); with yaw: omitted each panel
## faces the tracking origin (you). recenter_on_plug re-seats the whole arc in front of you on don.
##
## Positions (cylinder r=1.4, height y=1.30): left/center/right at yaw -35°/0/+35°.
xrmonitor = XR-left,   1920x1080@90, anchor:local pos:-0.80,1.30,-1.15, size:1.1
xrmonitor = XR-center, 1920x1080@90, anchor:local pos:0,1.30,-1.40,    size:1.2
xrmonitor = XR-right,  1920x1080@90, anchor:local pos:0.80,1.30,-1.15,  size:1.1

## Keep the panels SPARSE — the 46° FOV is narrow, so fewer, larger panels beat a dense grid. Add a 4th
## overhead/below panel only if you actually use it. Tune radius/height/spread by editing pos: above, or
## live with the `center`/`move`/`distance`/`scale` binds below, then read back `hyprctl openxr layout`.

## Pin your primary workspaces to the panels so they survive a logout (ordinary workspace rules — XR
## monitors are name-keyed like any output):
# workspace = 1, monitor:XR-center, default:true
# workspace = 2, monitor:XR-left
# workspace = 3, monitor:XR-right


#####################################################
### comp_main window placement (the toggle's XR side) #
#####################################################

## When `xreal-mode xr` runs, the xreal Monado's real compositor (comp_main) opens its output as an
## ordinary Wayland toplevel with app-id "openxr" / title "OpenXR application". These rules fullscreen
## it on the glasses' DisplayPort output so it scans out to the lenses. Change DP-5 to your connector
## (DP-5 on the AMD box; check `hyprctl monitors`). Keyed on app-id (class) so it is robust to the title.
## Modern unified windowrule grammar: comma-separated `<effect> <value>` fields + a `match:<prop>
## <value>`. `immediate 1` = tearing/lowest-latency present (a single solitary surface on DP-5 also
## qualifies for direct scanout).
windowrule = monitor DP-5, fullscreen 1, border_size 0, no_anim 1, no_blur 1, immediate 1, match:class ^(openxr)$


#####################################################
### binds — keyboard-centric 3DoF control          ###
#####################################################

## Cycle which panel subsequent verbs target, and recenter a panel in front of you.
bind = SUPER,       bracketright, xrmonitor, select next
bind = SUPER,       bracketleft,  xrmonitor, select prev
# Recenter WHILE WEARING the glasses, looking straight ahead at where you want the screen (it captures the
# live head pose). NOTE: SUPER+Home is taken by walker in Omarchy, so this uses SUPER+SHIFT+Home; the raw
# dispatch is `hyprctl dispatch xrmonitor center`.
bind = SUPER SHIFT,  Home,         xrmonitor, center

## Push/pull + rescale the selected panel (binde repeats while held).
binde = SUPER, equal, xrmonitor, distance -0.15
binde = SUPER, minus, xrmonitor, distance +0.15
binde = SUPER SHIFT, equal, xrmonitor, scale 1.1
binde = SUPER SHIFT, minus, xrmonitor, scale 0.9

## Gaze grab: look at a panel, tap to grab it (it follows your gaze), tap again to drop. This is the
## controller-free way to rearrange the arc; on these glasses the gaze ray is your HEAD forward vector
## (no eye tracking) — aim by centering the panel in view. Pairs naturally with voice.
bind  = SUPER SHIFT, G,     xrmonitor, gazegrab
binde = SUPER ALT,   equal, xrmonitor, gazepush 0.1
binde = SUPER ALT,   minus, xrmonitor, gazepush -0.1

## The flat<->XR toggle. FLAT = ordinary head-locked 1920x1080 monitor on the glasses' DP; XR = this
## 3DoF arc. Bind both (adjust the chord to taste; verify it is free in your layout):
bind = SUPER,       F12, exec, ~/code/Hyprland/scripts/xreal-mode.sh xr
bind = SUPER SHIFT, F12, exec, ~/code/Hyprland/scripts/xreal-mode.sh flat
## SBS stereo fighting back? Fall back to a single mono panel with:  xreal-mode.sh xr --mono


#####################################################
### Lunar Lake laptop (single-GPU) notes            ###
#####################################################
## This profile is machine-agnostic. On the Intel Lunar Lake laptop:
##   * There is ONE GPU, so openxr:gpu stays unset (as above) — nothing to pin.
##   * The glasses' DP connector name differs (NOT DP-5). Find it with `hyprctl monitors`, then either
##     set XREAL_MONITOR=<name> for the toggle and edit the `monitor <name>` window rules above, or rely
##     on the toggle's auto-detection (it matches the "Air 2 Ultra" EDID description regardless of name).
##   * The xreal monado build lives at a different repo path — set MONADO_XREAL_SERVICE in
##     ~/.config/xreal/monado.env (see contrib/xreal/monado-xreal.service) and MONADO_XREAL_BUILD for
##     the toggle. Everything else is identical.

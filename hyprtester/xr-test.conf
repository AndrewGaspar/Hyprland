# Hyprland config for the OpenXR integration test suite (classic hyprlang).
# Used by `hyprtester --xr`. Kept intentionally minimal for WP10: just a headless
# monitor and openxr enabled. The declared `xrmonitor` fixtures for xr_config_declared
# are added in WP11 (once the xrmonitor keyword lands in WP4).

monitor = HEADLESS-1, 1920x1080@60, 0x0, 1

openxr {
    enabled = 1
    # Environment-specific (this dual-GPU dev box only): Monado's null-compositor picks the
    # NVIDIA render node, while Hyprland nested would otherwise default to AMD, causing a
    # cross-GPU EGL interop crash inside Monado at xrCreateSwapchain (see WP7/WP10 findings).
    # Pin to the NVIDIA node so local `--xr` runs don't hit that. Harmless on single-GPU CI.
    gpu = /dev/dri/renderD128
}

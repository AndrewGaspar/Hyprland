# Hyprland config for the OpenXR integration test suite (classic hyprlang).
# Used by `hyprtester --xr`.

monitor = HEADLESS-1, 1920x1080@60, 0x0, 1

openxr {
    enabled = 1
    # Environment-specific (this dual-GPU dev box only): Monado's null-compositor picks the
    # NVIDIA render node, while Hyprland nested would otherwise default to AMD, causing a
    # cross-GPU EGL interop crash inside Monado at xrCreateSwapchain (see WP7/WP10 findings).
    # Pin to the NVIDIA node so local `--xr` runs don't hit that. Harmless on single-GPU CI.
    gpu = /dev/dri/renderD128
}

# Declared-set fixtures for xr_config_declared (WP11, docs/openxr/06-testing.md §2.1). Unique
# names come from runtime creation; these two are static because the config file is static.
# xr_config_declared temporarily rewrites this file (and restores it) to exercise reload
# reconciliation of a changed/removed declaration — keep these two lines exactly as-is so its
# "original content" restore round-trips byte-for-byte.
xrmonitor = XR-conf-a, 1280x720@60, anchor:local pos:0,1.4,-1.5 yaw:0, size:1.0
xrmonitor = XR-conf-b, 1024x768,    anchor:head offset:0.3,-0.1,-1.0, size:0.5

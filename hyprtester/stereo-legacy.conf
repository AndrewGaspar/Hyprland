# Hyprland config for the stereo FRONT-END run (classic hyprlang), research/24 §3.10.
#
#   cd hyprtester && ../build-debug/hyprtester/hyprtester -c ./stereo-legacy.conf \
#       -b ../build-debug/Hyprland -p ./plugin/hyprtestplugin.so stereoLegacyConfigFrontEnds
#
# The main suite runs test.lua, so `hl.monitor{ stereo = ... }` is the only front-end it can
# reach — and the syntax actually shipped to users (example/xreal.conf, docs/openxr/05-configuration.md
# §8.5) is the classic one below. gtests cannot cover it either: CConfigManager's constructor
# verifies (and creates) the user's real config, so instantiating it in a unit test would write to
# ~/.config/hypr. Hence a second, tiny config run.
#
# Three declarations, one per wiring, all asking for the same pack:
#   - the compact positional token   `..., stereo:sbs`
#   - the two-token positional form  `..., stereo, sbs`
#   - the monitorv2 `stereo =` key
# plus a control on the same mode with no stereo at all, which is what makes a passing run mean
# something (all four are 3840x1080; only the first three must come up as 1920-wide desktops).

monitor = HYPRTEST-LEG-POS, 3840x1080@60, auto-right, 1, stereo:sbs
monitor = HYPRTEST-LEG-KV, 3840x1080@60, auto-right, 1, stereo, sbs
monitor = HYPRTEST-LEG-CTL, 3840x1080@60, auto-right, 1

monitorv2 {
    output = HYPRTEST-LEG-V2
    mode = 3840x1080@60
    position = auto-right
    scale = 1
    stereo = sbs
}

# the harness creates its outputs at runtime; anything else lands here
monitor = , preferred, auto, 1

animations {
    enabled = false
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

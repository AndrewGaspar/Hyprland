# HypXRland desktop preview config — used by scripts/preview-xr.sh
# Runs a nested dev Hyprland with the XR extension enabled against a
# windowed Monado (remote driver), so the XR space is visible on the desktop.

monitor = , preferred, auto, 1

openxr {
    enabled = 1
    # This dual-GPU box: Monado picks the NVIDIA card (renderD128); Hyprland
    # must render XR buffers on the same GPU or swapchain creation crashes
    # inside Monado. Drop this line on a single-GPU machine.
    gpu = /dev/dri/renderD128
}

# A world-locked monitor straight ahead at eye height...
xrmonitor = XR-main, 1920x1080@60, anchor:local pos:0,1.5,-1.5 yaw:0, size:1.6

# ...and a head-leashed side panel that follows your view with a spring.
xrmonitor = XR-side, 1280x720@60, anchor:head offset:0.9,0,-1.2, size:0.9

# Terminal on the world-locked XR monitor so there is something to look at.
workspace = 1, monitor:XR-main, default:true
exec-once = kitty || foot || alacritty

misc {
    disable_hyprland_logo = false
}

# Handy binds inside the nested session (SUPER = the nested compositor's mod).
bind = SUPER, N, xrmonitor, create XR-extra 1280x720 anchor:body offset:0,-0.3,-1.0
bind = SUPER, M, xrmonitor, destroy XR-extra
bind = SUPER, RIGHT, xrmonitor, rotate 15
bind = SUPER, LEFT, xrmonitor, rotate -15
bind = SUPER, UP, xrmonitor, distance 0.25
bind = SUPER, DOWN, xrmonitor, distance -0.25
bind = SUPER, C, xrmonitor, center
bind = SUPER, Q, exit
